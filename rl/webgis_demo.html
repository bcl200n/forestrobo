<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>雷波林场 WebGIS · 原始地块边界</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:system-ui,sans-serif}
#map{width:100vw;height:100vh}
.panel{position:absolute;top:10px;right:10px;background:rgba(13,17,23,.92);color:#e6edf3;padding:14px;border-radius:10px;z-index:1000;max-width:300px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.panel h3{margin:0 0 8px;font-size:14px}
.panel .cat{margin:6px 0;padding:4px 8px;border-radius:4px}
.panel .cat:hover{background:rgba(255,255,255,.1);cursor:pointer}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.info{color:#8b949e;font-size:11px;margin-top:8px;line-height:1.5}
.info a{color:#79c0ff}
.leaflet-popup-content-wrapper{background:#21262d;color:#e6edf3;border-radius:8px}
.leaflet-popup-tip{background:#21262d}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h3>雷波林场 · 原始地块边界</h3>
<div class="cat" onclick="focusCategory('林下经济')"><span class="sw" style="background:#4caf50"></span>林下经济（石斛/黄莲）</div>
<div class="cat" onclick="focusCategory('直服用地')"><span class="sw" style="background:#ff9800"></span>直服用地</div>
<div class="cat" onclick="fitAll()"><span class="sw" style="background:#58a6ff"></span>全图</div>
<hr style="border-color:#30363d;margin:8px 0">
<div class="info" id="data-info">正在读取本地地块数据…</div>
<div class="info" id="load-status" role="status" aria-live="polite">正在加载地图组件…</div>
<div class="info">点击地块可查看来源文件、完整顶点数和坐标范围。坐标采用 WGS84，经度在前、纬度在后。</div>
<div class="info">底图为在线 Esri World Imagery 参考影像，拍摄日期与配准精度须另行核验。地块边界来自本地文件。</div>
<div class="info">林班文件仍待解析。当前地块数据没有实测地表高程，地形规划中的合成高程属于仿真条件。</div>
<div class="info"><a href="terrain_demo.html">打开地形分析页</a> · 高程来源和分辨率以该页说明为准。</div>
</div>
<script src="forest_features.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
var map = null;
var layersByCat = {};
var allParcels = null;
var loadStatus = document.getElementById('load-status');

function countPositions(coordinates) {
  if (!Array.isArray(coordinates) || !coordinates.length) return 0;
  if (typeof coordinates[0] === 'number') return 1;
  return coordinates.reduce(function(total, part) { return total + countPositions(part); }, 0);
}

function categoryOf(feature) {
  var category = String((feature.properties || {}).category || '');
  if (category.indexOf('林下经济') >= 0) return '林下经济';
  if (category.indexOf('直服') >= 0) return '直服用地';
  return category || '未分类';
}

function focusCategory(category) {
  if (!map || !layersByCat[category]) return;
  Object.keys(layersByCat).forEach(function(key) {
    if (key === category) layersByCat[key].addTo(map);
    else map.removeLayer(layersByCat[key]);
  });
  map.fitBounds(layersByCat[category].getBounds(), {padding: [50, 50]});
}

function fitAll() {
  if (!map || !allParcels || !allParcels.getBounds().isValid()) return;
  Object.keys(layersByCat).forEach(function(key) { layersByCat[key].addTo(map); });
  map.fitBounds(allParcels.getBounds(), {padding: [30, 30]});
}

function parcelPopup(feature, layer, displayName) {
  var properties = feature.properties || {};
  var box = document.createElement('div');
  var title = document.createElement('strong');
  title.textContent = displayName;
  box.appendChild(title);
  var bounds = layer.getBounds();
  var rows = [
    ['类别', categoryOf(feature)],
    ['来源', properties.source || '来源文件名待核验'],
    ['地块编号', feature.id == null ? '未提供' : String(feature.id)],
    ['完整顶点数', String(countPositions(feature.geometry.coordinates))],
    ['经度范围', bounds.getWest().toFixed(7) + ' ～ ' + bounds.getEast().toFixed(7)],
    ['纬度范围', bounds.getSouth().toFixed(7) + ' ～ ' + bounds.getNorth().toFixed(7)]
  ];
  rows.forEach(function(row) {
    var line = document.createElement('div');
    line.textContent = row[0] + '  ' + String(row[1]);
    box.appendChild(line);
  });
  return box;
}

(function initialize() {
  var data = window.FOREST_FEATURES;
  var info = document.getElementById('data-info');
  if (!data || data.type !== 'FeatureCollection' || !Array.isArray(data.features) || !data.features.length) {
    info.textContent = '本地地块数据未加载';
    loadStatus.textContent = '请确认 forest_features.js 与本页面位于同一目录，并由本地 GeoJSON 生成。';
    return;
  }
  var vertices = data.features.reduce(function(total, feature) {
    return total + countPositions((feature.geometry || {}).coordinates);
  }, 0);
  info.textContent = data.features.length + ' 个地块 · ' + vertices.toLocaleString('zh-CN') + ' 个完整边界顶点';
  if (!window.L) {
    loadStatus.textContent = '本地地块数据已读取，在线地图组件加载失败。请联网后重试。';
    return;
  }
  map = L.map('map');
  allParcels = L.featureGroup();
  var colors = {'林下经济': '#4caf50', '直服用地': '#ff9800'};
  var names = {};
  var indexes = {};
  data.features.forEach(function(feature) {
    var name = String((feature.properties || {}).name || '未命名地块');
    names[name] = (names[name] || 0) + 1;
  });
  try {
    L.geoJSON(data, {
      style: function(feature) {
        return {color: colors[categoryOf(feature)] || '#58a6ff', weight: 2, fillOpacity: .25, smoothFactor: 0};
      },
      onEachFeature: function(feature, layer) {
        if (typeof layer.getBounds !== 'function') return;
        var category = categoryOf(feature);
        var name = String((feature.properties || {}).name || '未命名地块');
        indexes[name] = (indexes[name] || 0) + 1;
        var displayName = names[name] > 1 ? name + ' ' + indexes[name] : name;
        layer.bindPopup(parcelPopup(feature, layer, displayName));
        var label = document.createElement('span');
        label.textContent = displayName;
        layer.bindTooltip(label, {sticky: true});
        if (!layersByCat[category]) layersByCat[category] = L.featureGroup();
        layersByCat[category].addLayer(layer);
        allParcels.addLayer(layer);
      }
    });
  } catch (error) {
    loadStatus.textContent = '地块几何加载失败，请核验 GeoJSON。' + error.message;
    return;
  }
  if (!allParcels.getBounds().isValid()) {
    loadStatus.textContent = '本地数据中没有有效的多边形边界。';
    return;
  }
  fitAll();
  L.control.scale({imperial: false, position: 'bottomleft'}).addTo(map);
  loadStatus.textContent = '完整地块边界已加载，在线参考底图正在加载。';
  var loadedTiles = 0;
  var failedTiles = 0;
  var imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles © Esri — Esri, Maxar, Earthstar Geographics and the GIS User Community'
  });
  imagery.on('tileload', function() {
    loadedTiles += 1;
    loadStatus.textContent = failedTiles ? '部分参考底图未加载，地块边界仍可查看和筛选。' : '完整地块边界与在线参考底图已加载。';
  });
  imagery.on('tileerror', function() {
    failedTiles += 1;
    loadStatus.textContent = loadedTiles ? '部分参考底图未加载，地块边界仍可查看和筛选。' : '在线参考底图加载失败，当前显示本地地块边界。';
  });
  imagery.addTo(map);
}());
</script>
</body>
</html>
