<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雷波林场 · 地形与路线</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161e27;--ink:#e6edf3;--muted:#a8b6c2;--line:#354454;--accent:#66deed;--green:#9bd4a4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,sans-serif}
main{max-width:1040px;padding:22px clamp(12px,4vw,32px) 32px;margin:auto}
h1{margin:0;font-size:clamp(22px,4vw,32px);font-weight:650}
h2{margin:0 0 6px;font-size:16px}
p{margin:4px 0}
.notice{margin:12px 0;padding:10px 14px;border:1px solid #725935;border-radius:7px;background:#30271c;color:#f4d39e}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:12px 0}
.toolbar label,.muted{color:var(--muted)}
.modes{display:flex;gap:5px;flex-wrap:wrap}
select,button{padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:inherit}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
button:enabled{cursor:pointer}
button:disabled,select:disabled{opacity:.5}
canvas{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#101821;cursor:crosshair}
.legend,.metrics{display:flex;gap:7px 14px;flex-wrap:wrap;min-height:24px;margin:7px 0;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px}
#routeStatus{color:var(--accent);font-weight:600}
#cellInfo{min-height:22px}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:7px;padding:11px 13px;background:var(--panel)}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 10px;margin:0}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
.note{margin-top:12px;font-size:12px;color:var(--muted)}
@media(max-width:620px){.info{grid-template-columns:1fr}.toolbar{gap:6px 9px}}
</style>
</head>
<body>
<main>
  <h1>雷波林场 · 地形与路线</h1>
  <p class="muted">实际 KMZ 地块边界与 Copernicus DEM GLO-30 地表高程</p>
  <p class="notice">DSM 约 30 米分辨率，高程可能包含树冠和建筑。路线用于区域尺度分析，起终点是仿真假设，现场通行需另行核验。</p>
  <div class="toolbar">
    <label for="parcel">选择地块</label><select id="parcel" disabled></select>
    <div class="modes" role="group" aria-label="地形图层">
      <button type="button" data-layer="elevation" aria-pressed="true" disabled>地形</button>
      <button type="button" data-layer="slope" aria-pressed="false" disabled>坡度</button>
      <button type="button" data-layer="cost" aria-pressed="false" disabled>通行成本</button>
    </div>
    <label><input type="checkbox" id="showRoute" checked disabled> 显示规划路线</label>
  </div>
  <canvas id="map" width="900" height="530" aria-label="雷波林场所选地块的北向上地形图"></canvas>
  <div id="legend" class="legend" aria-label="地图图例"></div>
  <p id="routeStatus" role="status">正在读取本地地形数据…</p>
  <div id="metrics" class="metrics"></div>
  <p id="cellInfo" class="muted"></p>
  <div class="info">
    <section class="card">
      <h2>地块资料</h2>
      <dl>
        <dt>名称</dt><dd id="parcelName">—</dd>
        <dt>功能分区</dt><dd id="functionZone">—</dd>
        <dt>边界来源</dt><dd id="parcelSource">—</dd>
        <dt>网格范围</dt><dd id="extent">—</dd>
        <dt>有效高程</dt><dd id="elevationRange">—</dd>
      </dl>
    </section>
    <section class="card">
      <h2>地形数据</h2>
      <dl>
        <dt>来源</dt><dd id="dsmLabel">—</dd>
        <dt>源文件</dt><dd id="dsmFile">—</dd>
        <dt>规划格长</dt><dd id="cellSize">—</dd>
        <dt>数据说明</dt><dd id="dsmReference">—</dd>
        <dt>SHA-256</dt><dd id="dsmHash">—</dd>
      </dl>
    </section>
  </div>
  <p class="note">坡度 ≥45° 或高程、坡度缺测时禁行。对角移动不能穿过禁行格夹角。路线加权代价结合格间水平距离、进入格坡度成本和坡度增加惩罚，用于比较规划路线。</p>
</main>
<script src="forest_terrain_data.js"></script>
<script>
'use strict';

const data = window.FOREST_TERRAIN;
const byId = id => document.getElementById(id);
const parcelPicker = byId('parcel');
const layerButtons = [...document.querySelectorAll('[data-layer]')];
const routeToggle = byId('showRoute');
const canvas = byId('map');
const ctx = canvas.getContext('2d');
const legend = byId('legend');
const routeStatus = byId('routeStatus');
const cellInfo = byId('cellInfo');
const metrics = byId('metrics');
const boundaryColor = '#b5e0ae';
const routeColor = '#66deed';
const unknownColor = '#465463';
const blockedColor = '#b04969';
const slopeColors = ['#529b75','#acd27a','#f0c069','#e47a49',blockedColor];
const costColors = ['#529b75','#e8bd68','#e47a49',blockedColor];
let parcel;
let layer = 'elevation';
let frame;
let heightRange;

function setText(id, value) {
  byId(id).textContent = value ?? '—';
}

function fixed(value, digits = 0) {
  return Number.isFinite(value) ? value.toFixed(digits) : '—';
}

function slopeCost(slope) {
  if (!Number.isFinite(slope) || slope < 0 || slope >= 45) return Infinity;
  if (slope < 15) return 1;
  if (slope < 25) return 1 + (slope - 15) * .05;
  if (slope < 35) return 1.5 + (slope - 25) * .15;
  return 3 + (slope - 35) * .3;
}

function elevationColor(fraction) {
  return `rgb(${Math.round(31 + 195 * fraction)}, ${Math.round(73 + 135 * fraction)}, ${Math.round(84 + 60 * fraction)})`;
}

function cellColor(elevation, slope) {
  if (layer === 'elevation') {
    if (!Number.isFinite(elevation)) return unknownColor;
    const [min, max] = heightRange;
    return elevationColor(max > min ? (elevation - min) / (max - min) : .5);
  }
  if (!Number.isFinite(slope)) return unknownColor;
  if (layer === 'slope') {
    const index = slope < 15 ? 0 : slope < 25 ? 1 : slope < 35 ? 2 : slope < 45 ? 3 : 4;
    return slopeColors[index];
  }
  const cost = slopeCost(slope);
  return costColors[cost < 1.5 ? 0 : cost < 3 ? 1 : cost < 6 ? 2 : 3];
}

function mapPoint(x, y) {
  return [frame.left + x * frame.scale, frame.top + (frame.rows - y) * frame.scale];
}

function polygonPath() {
  ctx.beginPath();
  for (const [index, point] of parcel.boundary.entries()) {
    if (index === 0) ctx.moveTo(...mapPoint(...point));
    else ctx.lineTo(...mapPoint(...point));
  }
  ctx.closePath();
}

function draw() {
  ctx.fillStyle = '#101821';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!parcel || !frame) return;
  polygonPath();
  ctx.fillStyle = unknownColor;
  ctx.fill();
  ctx.save();
  ctx.clip();
  for (const [y, row] of parcel.elevationM.entries()) {
    for (const [x, elevation] of row.entries()) {
      const slope = parcel.slopeDeg[y][x];
      if (!Number.isFinite(elevation) && !Number.isFinite(slope)) continue;
      ctx.fillStyle = cellColor(elevation, slope);
      ctx.fillRect(...mapPoint(x, y + 1), frame.scale, frame.scale);
    }
  }
  ctx.restore();
  ctx.strokeStyle = boundaryColor;
  ctx.lineWidth = 2;
  ctx.stroke();

  if (routeToggle.checked && parcel.path.length) {
    const points = parcel.path.map(([x, y]) => mapPoint(x + .5, y + .5));
    ctx.beginPath();
    ctx.moveTo(...points[0]);
    for (const point of points.slice(1)) ctx.lineTo(...point);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0d1117';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.strokeStyle = routeColor;
    ctx.lineWidth = 3;
    ctx.stroke();
    for (const [index, [x, y]] of [points[0], points.at(-1)].entries()) {
      ctx.beginPath();
      ctx.arc(x, y, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = index === 0 ? '#f4d39e' : '#e9ffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#101821';
      ctx.stroke();
    }
  }
  ctx.font = 'bold 16px system-ui';
  ctx.fillStyle = '#e6edf3';
  ctx.textAlign = 'right';
  ctx.fillText('北 ↑', canvas.width - 18, 25);
}

function addLegend(color, label) {
  const item = document.createElement('span');
  const swatch = document.createElement('i');
  swatch.className = 'sw';
  swatch.style.background = color;
  item.append(swatch, label);
  legend.append(item);
}

function updateLegend() {
  legend.replaceChildren();
  if (!parcel) return;
  if (layer === 'elevation' && heightRange.length) {
    addLegend(elevationColor(0), `低处 ${fixed(heightRange[0])} m`);
    addLegend(elevationColor(1), `高处 ${fixed(heightRange[1])} m`);
  } else if (layer === 'slope') {
    ['<15°','15–<25°','25–<35°','35–<45°','≥45° 禁行'].forEach((label, i) =>
      addLegend(slopeColors[i], label));
  } else if (layer === 'cost') {
    ['权重 1–<1.5','权重 1.5–<3','权重 3–<6','禁行'].forEach((label, i) =>
      addLegend(costColors[i], label));
  }
  addLegend(unknownColor, '区内缺测');
  addLegend(boundaryColor, 'KMZ 边界');
  if (routeToggle.checked && parcel.path.length) addLegend(routeColor, '规划路线');
}

function selectParcel(parcels) {
  parcel = parcels.get(parcelPicker.value);
  const {elevationM, extentLonLat, path} = parcel;
  const cols = elevationM[0]?.length ?? 0;
  const rows = elevationM.length;
  const scale = Math.min((canvas.width - 72) / cols, (canvas.height - 66) / rows);
  frame = cols && rows ? {
    cols, rows, scale,
    left: (canvas.width - cols * scale) / 2,
    top: (canvas.height - rows * scale) / 2
  } : null;
  const heights = elevationM.flat().filter(Number.isFinite);
  heightRange = heights.length ? [Math.min(...heights), Math.max(...heights)] : [];
  const coordinates = point => `${fixed(point[0], 5)}°E, ${fixed(point[1], 5)}°N`;
  setText('parcelName', parcel.name);
  setText('functionZone', parcel.functionZone);
  setText('parcelSource', parcel.source);
  setText('extent', `${coordinates(extentLonLat[0])} 至 ${coordinates(extentLonLat[1])}`);
  setText('elevationRange', heightRange.length ?
    `${fixed(heightRange[0])}–${fixed(heightRange[1])} m · ${heights.length}/${parcel.parcelCells} 格` :
    '此地块无有效高程格');
  routeToggle.disabled = !path.length;
  routeStatus.textContent = path.length ? '已计算所选模拟起终点的路线。' :
    '所选模拟起终点未找到满足约束的路线。';
  metrics.textContent = path.length && parcel.metrics ?
    `水平距离 ${fixed(parcel.metrics.length_m, 1)} m · 累计上升 ${fixed(parcel.metrics.climb_m, 1)} m · 加权代价 ${fixed(parcel.metrics.weighted_cost, 2)}` : '';
  cellInfo.textContent = '点击地图可查看单格高程、坡度和成本。';
  updateLegend();
  draw();
}

function inspectCell(event) {
  if (!parcel || !frame) return;
  const rect = canvas.getBoundingClientRect();
  const px = (event.clientX - rect.left) * canvas.width / rect.width;
  const py = (event.clientY - rect.top) * canvas.height / rect.height;
  const x = Math.floor((px - frame.left) / frame.scale);
  const y = frame.rows - 1 - Math.floor((py - frame.top) / frame.scale);
  const elevation = parcel.elevationM[y]?.[x];
  const slope = parcel.slopeDeg[y]?.[x];
  if (!Number.isFinite(elevation) && !Number.isFinite(slope)) {
    cellInfo.textContent = '该格位于地块外或缺少数据。';
    return;
  }
  const cost = slopeCost(slope);
  const height = Number.isFinite(elevation) ? `${fixed(elevation, 1)} m` : '缺测';
  const grade = Number.isFinite(slope) ? `${fixed(slope, 2)}°` : '缺测';
  cellInfo.textContent = `格心 (${x}, ${y}) · 高程 ${height} · 坡度 ${grade} · 通行成本 ${Number.isFinite(cost) ? fixed(cost, 2) : '禁行'}`;
}

function init() {
  if (data?.schema !== 'leibo-parcel-terrain-v1' ||
      data.elevation?.kind !== 'copernicus_dsm' || !data.parcels?.length) {
    routeStatus.textContent = '未加载雷波林场实际地形数据。请确认本页与 forest_terrain_data.js 位于同一目录。';
    draw();
    return;
  }
  const parcels = new Map();
  const nameCounts = new Map();
  for (const item of data.parcels) {
    const id = String(item.id);
    parcels.set(id, item);
    const count = (nameCounts.get(item.name) ?? 0) + 1;
    nameCounts.set(item.name, count);
    const option = document.createElement('option');
    option.value = id;
    option.textContent = count > 1 ? `${item.name}（${count}）` : item.name;
    parcelPicker.append(option);
  }
  parcelPicker.disabled = false;
  setText('dsmLabel', data.elevation.label);
  setText('dsmFile', data.elevation.file);
  setText('dsmReference', data.elevation.reference);
  setText('dsmHash', data.elevation.sha256);
  setText('cellSize', `${fixed(data.cellSizeM)} m`);
  parcelPicker.addEventListener('change', () => selectParcel(parcels));
  for (const button of layerButtons) {
    button.disabled = false;
    button.addEventListener('click', () => {
      layer = button.dataset.layer;
      for (const control of layerButtons) control.setAttribute('aria-pressed', control === button);
      updateLegend();
      draw();
    });
  }
  routeToggle.addEventListener('change', () => {
    updateLegend();
    draw();
  });
  canvas.addEventListener('click', inspectCell);
  selectParcel(parcels);
}

init();
</script>
</body>
</html>
