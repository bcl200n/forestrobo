<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雷波林场 · 多狗协同搜索</title>
<style>
body{margin:16px;background:#0d1117;color:#e6edf3;font-family:system-ui;display:flex;flex-direction:column;align-items:center}
h1{margin:8px 0 4px;font-size:20px}
.sub{margin:4px 0 12px;color:#a7b5c2;font-size:13px;text-align:center}
.controls,.legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 14px;margin:8px 0}
select,button{padding:6px 10px;font:inherit;color:#e6edf3;background:#212a35;border:1px solid #526173;border-radius:5px}
button:disabled,select:disabled{opacity:.55}
canvas{width:min(100%,720px);height:auto;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#stats{min-height:1.5em;margin:8px 0 2px;color:#8dbfff;font-size:14px;text-align:center}
.legend{font-size:12px;color:#a7b5c2}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<h1>雷波林场 · 多狗协同搜索</h1>
<p class="sub">KMZ 实际地块边界 · 北朝上 · 10 只机器狗二维搜索仿真<br>网格与目标为演示设定，轨迹由仿真生成。</p>
<div class="controls">
  <label for="plot">选择地块</label><select id="plot" disabled></select>
  <button id="restart" type="button" disabled>重新搜索</button>
</div>
<canvas id="cv" width="720" height="720" aria-label="所选地块边界及模拟搜索过程"></canvas>
<div id="stats" role="status">加载地块数据…</div>
<div class="legend">
  <span><span class="sw" style="background:#76b78a"></span>地块边界</span>
  <span><span class="sw" style="background:#365657"></span>已搜索</span>
  <span><span class="sw" style="background:#ff7575;border-radius:50%"></span>模拟目标</span>
  <span><span class="sw" style="background:#7ce39b;border-radius:50%"></span>已找到</span>
</div>
<script src="forest_features.js"></script>
<script>
'use strict';

const gridSize = 40;
const cellPixels = 18;
const dogColors = ['#4fc3f7','#ffb74d','#81c784','#e57373','#ba68c8','#4dd0e1','#f06292','#dce775','#ffa066','#9575cd'];
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');
const plot = document.getElementById('plot');
const restart = document.getElementById('restart');
const features = (window.FOREST_FEATURES?.features ?? []).filter(feature =>
  feature.geometry?.type === 'Polygon' && feature.geometry.coordinates[0]?.length >= 4);
const featuresById = new Map(features.map(feature => [String(feature.id), feature]));
let simulation;
let timer;

function projectRings(coordinates) {
  const outer = coordinates[0];
  const west = Math.min(...outer.map(point => point[0]));
  const east = Math.max(...outer.map(point => point[0]));
  const south = Math.min(...outer.map(point => point[1]));
  const north = Math.max(...outer.map(point => point[1]));
  // Scale longitude at the plot's mean latitude and use one scale for both axes.
  const longitudeScale = Math.cos((south + north) * Math.PI / 360);
  const width = (east - west) * longitudeScale;
  const height = north - south;
  const scale = (gridSize - 4) / Math.max(width, height);
  return coordinates.map(ring => ring.map(([longitude, latitude]) => [
    gridSize / 2 + (longitude - (west + east) / 2) * longitudeScale * scale,
    gridSize / 2 + ((south + north) / 2 - latitude) * scale
  ]));
}

function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [ax, ay] = ring[i];
    const [bx, by] = ring[j];
    if ((ay > y) !== (by > y) && x < (bx - ax) * (y - ay) / (by - ay) + ax) {
      inside = !inside;
    }
  }
  return inside;
}

function intersects(a, b, c, d) {
  const cross = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  return Math.max(a[0], b[0]) >= Math.min(c[0], d[0]) &&
    Math.max(c[0], d[0]) >= Math.min(a[0], b[0]) &&
    Math.max(a[1], b[1]) >= Math.min(c[1], d[1]) &&
    Math.max(c[1], d[1]) >= Math.min(a[1], b[1]) &&
    cross(a, b, c) * cross(a, b, d) <= 0 &&
    cross(c, d, a) * cross(c, d, b) <= 0;
}

function buildGrid(rings) {
  const cells = new Map();
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      const center = [x + .5, y + .5];
      if (inRing(...center, rings[0]) && !rings.slice(1).some(ring => inRing(...center, ring))) {
        cells.set(y * gridSize + x, {center, neighbors: []});
      }
    }
  }
  const edges = rings.flatMap(ring => ring.slice(1).map((point, i) => [ring[i], point]));
  for (const [key, cell] of cells) {
    // Join adjacent centers only when the entire segment stays within the plot.
    for (const neighborKey of [key + 1, key + gridSize]) {
      const neighbor = cells.get(neighborKey);
      if (!neighbor || edges.some(([a, b]) => intersects(cell.center, neighbor.center, a, b))) {
        continue;
      }
      cell.neighbors.push(neighbor);
      neighbor.neighbors.push(cell);
    }
  }
  return cells;
}

function searchFrom(start, limit = Infinity) {
  const order = [start];
  const records = new Map([[start, {distance: 0, parent: null}]]);
  for (let i = 0; i < order.length; i++) {
    const cell = order[i];
    const {distance} = records.get(cell);
    if (distance === limit) continue;
    for (const neighbor of cell.neighbors) {
      if (records.has(neighbor)) continue;
      order.push(neighbor);
      records.set(neighbor, {distance: distance + 1, parent: cell});
    }
  }
  return {order, records};
}

function largestComponent(cells) {
  const visited = new Set();
  let largest = [];
  for (const cell of cells.values()) {
    if (visited.has(cell)) continue;
    const {order} = searchFrom(cell);
    order.forEach(neighbor => visited.add(neighbor));
    if (order.length > largest.length) largest = order;
  }
  return largest;
}

function setupSimulation(rings) {
  const component = largestComponent(buildGrid(rings));
  if (component.length <= dogColors.length) return null;
  const centerDistance = cell => Math.hypot(cell.center[0] - gridSize / 2, cell.center[1] - gridSize / 2);
  const start = component.reduce((closest, cell) =>
    centerDistance(cell) < centerDistance(closest) ? cell : closest);
  const starts = searchFrom(start).order.slice(0, dogColors.length);
  const available = new Set(component.filter(cell => !starts.includes(cell)));
  const targets = [];
  const distances = [searchFrom(start).records];
  while (targets.length < 4 && available.size) {
    let farthest;
    let best = -1;
    for (const cell of available) {
      const distance = Math.min(...distances.map(map => map.get(cell).distance));
      if (distance > best) {
        farthest = cell;
        best = distance;
      }
    }
    available.delete(farthest);
    targets.push(farthest);
    distances.push(searchFrom(farthest).records);
  }
  return {rings, targets, dogs: starts.map(cell => ({cell, path: []})), seen: new Set(), step: 0};
}

function stepSim({dogs, seen, targets}) {
  for (const dog of dogs) {
    searchFrom(dog.cell, 3).order.forEach(cell => seen.add(cell));
    if (seen.has(dog.path.at(-1))) dog.path = [];
  }
  if (targets.every(target => seen.has(target))) return true;

  const frontier = new Set();
  for (const cell of seen) {
    for (const neighbor of cell.neighbors) {
      if (!seen.has(neighbor)) frontier.add(neighbor);
    }
  }
  for (const dog of dogs) frontier.delete(dog.path.at(-1));
  for (const dog of dogs) {
    if (dog.path.length || !frontier.size) continue;
    const {order, records} = searchFrom(dog.cell);
    const destination = order.find(cell => frontier.has(cell));
    if (!destination) continue;
    frontier.delete(destination);
    for (let cell = destination; cell !== dog.cell; cell = records.get(cell).parent) {
      dog.path.unshift(cell);
    }
  }
  for (const dog of dogs) {
    if (dog.path.length) dog.cell = dog.path.shift();
  }
  return false;
}

function draw() {
  ctx.fillStyle = '#151e26';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!simulation) return;
  const {rings, dogs, seen, targets} = simulation;
  ctx.beginPath();
  for (const ring of rings) {
    for (const [index, [x, y]] of ring.entries()) {
      if (index === 0) ctx.moveTo(x * cellPixels, y * cellPixels);
      else ctx.lineTo(x * cellPixels, y * cellPixels);
    }
    ctx.closePath();
  }
  ctx.fillStyle = '#233c34';
  ctx.fill('evenodd');
  ctx.save();
  ctx.clip('evenodd');
  ctx.fillStyle = '#365657';
  for (const {center: [x, y]} of seen) {
    ctx.fillRect((x - .5) * cellPixels, (y - .5) * cellPixels, cellPixels - 1, cellPixels - 1);
  }
  ctx.restore();
  ctx.strokeStyle = '#76b78a';
  ctx.lineWidth = 2;
  ctx.stroke();

  for (const cell of targets) {
    const [x, y] = cell.center.map(value => value * cellPixels);
    ctx.strokeStyle = seen.has(cell) ? '#7ce39b' : '#ff7575';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, 2 * Math.PI);
    ctx.stroke();
  }
  for (const [index, dog] of dogs.entries()) {
    const [x, y] = dog.cell.center.map(value => value * cellPixels);
    ctx.fillStyle = dogColors[index];
    ctx.beginPath();
    ctx.moveTo(x, y - 7);
    ctx.lineTo(x - 6, y + 5);
    ctx.lineTo(x + 6, y + 5);
    ctx.closePath();
    ctx.fill();
  }
}

function tick() {
  simulation.step++;
  const done = stepSim(simulation);
  draw();
  const {step, dogs, seen, targets} = simulation;
  stats.textContent = `第 ${step} 步 · ${dogs.length} 只机器狗 · 找到 ${targets.filter(target => seen.has(target)).length}/${targets.length} 个目标${done ? ' · 搜索完成' : ''}`;
  if (!done) timer = setTimeout(tick, 90);
}

function init() {
  clearTimeout(timer);
  const feature = featuresById.get(plot.value);
  simulation = feature ? setupSimulation(projectRings(feature.geometry.coordinates)) : null;
  if (simulation) {
    tick();
  } else {
    draw();
    stats.textContent = feature ? '地块内可连接的网格不足。请选择其他地块。' :
      '未加载林场地块。请确认本页与 forest_features.js 位于同一目录。';
  }
}

const labelCounts = new Map();
for (const feature of features) {
  const {name, category, functionZone} = feature.properties;
  const group = category.replace(/\(\d+\)$/, '');
  const base = `${functionZone || name} · ${group}`;
  const count = (labelCounts.get(base) ?? 0) + 1;
  labelCounts.set(base, count);
  const option = document.createElement('option');
  option.value = String(feature.id);
  option.textContent = count > 1 ? `${base}（${count}）` : base;
  plot.append(option);
}
plot.disabled = restart.disabled = !features.length;
plot.addEventListener('change', init);
restart.addEventListener('click', init);
init();
</script>
</body>
</html>
