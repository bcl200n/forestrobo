<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>雷波林场 — 多狗协同搜索</title>
<style>
body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui;display:flex;flex-direction:column;align-items:center}
h2{margin:10px 0 2px;font-size:16px}
.sub{font-size:12px;color:#8b49e;margin:2px 0 8px}
#stats{font-family:Consolas,monospace;font-size:13px;color:#58a6ff;margin:4px 0}
canvas{border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.legend{display:flex;gap:14px;font-size:11px;color:#849e;margin-top:6px;flex-wrap:wrap;justify-content:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:middle}
</style>
</head>
<body>
<h2>雷波林场 · 多狗协同搜索</h2>
<div class="sub">林下经济地块（石斛 / 黄莲）· 10只机器狗 · 市场竞拍协同</div>
<canvas id="cv"></canvas>
<div id="stats">初始化...</div>
<div class="legend">
<span><span class="sw" style="background:#2d5a27"></span>石斛</span>
<span><span class="sw" style="background:#5a4a2d"></span>黄莲</span>
<span><span class="sw" style="background:#3a3a3a"></span>待定</span>
<span><span class="sw" style="background:#ff5252;border-radius:50%"></span>目标</span>
<span><span class="sw" style="background:#4caf50;border-radius:50%"></span>已找到</span>
</div>
<script>
'use strict';
var CELL=24, GS=40, W=GS*CELL;
var cv=document.getElementById('cv'); cv.width=W; cv.height=W;
var ctx=cv.getContext('2d');
var stats=document.getElementById('stats');

var REGIONS=[
  {name:'石斛', color:'#2d5a27', label:'Dendrobium',
   poly:[[8,32],[10,35],[14,36],[18,34],[20,30],[18,26],[14,24],[10,25],[8,28]]},
  {name:'黄莲', color:'#5a4a2d', label:'Coptis',
   poly:[[22,10],[26,8],[30,9],[34,12],[35,16],[33,20],[28,22],[24,20],[22,16]]},
  {name:'待定A', color:'#3a3a3a', label:'',
   poly:[[10,8],[14,6],[17,8],[16,12],[12,14],[9,12]]},
  {name:'待定B', color:'#3a3a3a', label:'',
   poly:[[28,28],[32,26],[35,28],[34,32],[30,34],[27,32]]}
];

var DC=['#4fc3f7','#ffb74d','#81c784','#e57373','#ba68c8','#4dd0e1','#f06292','#aed581','#ff8a65','#9575cd'];
var ND=10;
var dogs=[], targets=[], found={}, step=0, timer=null;

function init(){
  step=0; found={}; dogs=[]; targets=[[12,30],[27,14],[12,10],[31,30]];
  for(var i=0;i<ND;i++){
    var a=2*Math.PI*i/ND;
    dogs.push({id:i, x:20+5*Math.cos(a), y:20+5*Math.sin(a), known:{}, assigned:null});
  }
  if(timer)clearTimeout(timer);
  tick();
}

function inPoly(x,y,poly){
  var inside=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    if(((poly[i][1]>y)!==(poly[j][1]>y)) &&
       x<(poly[j][0]-poly[i][0])*(y-poly[i][1])/(poly[j][1]-poly[i][1])+poly[i][0])
      inside=!inside;
  }
  return inside;
}

function ok(x,y){
  if(x<0||x>=GS||y<0||y>=GS)return false;
  for(var i=0;i<REGIONS.length;i++)if(inPoly(x,y,REGIONS[i].poly))return true;
  return false;
}

function scan(d){
  var x=Math.round(d.x), y=Math.round(d.y);
  for(var dx=-3;dx<=3;dx++)for(var dy=-3;dy<=3;dy++){
    if(dx*dx+dy*dy>9)continue;
    d.known[(x+dx)+','+(y+dy)]=1;
  }
}

function stepSim(){
  step++;
  // frontier auction
  var idle=[], allF={}, k, i, d;
  for(i=0;i<dogs.length;i++){
    if(!dogs[i].assigned)idle.push(dogs[i]);
    scan(dogs[i]);
    var kn=dogs[i].known;
    for(k in kn){
      var p=k.split(','); var x=+p[0], y=+p[1];
      var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      for(var j=0;j<4;j++){
        var nx=x+dirs[j][0], ny=y+dirs[j][1];
        if(ok(nx,ny)&&!kn[nx+','+ny])allF[nx+','+ny]=[nx,ny];
      }
    }
  }
  for(i=0;i<targets.length;i++)if(!found[i])allF[targets[i][0]+','+targets[i][1]]=targets[i];
  var cands=[];
  for(k in allF){
    var isAssigned=false;
    for(var m=0;m<dogs.length;m++)if(dogs[m].assigned&&dogs[m].assigned.join(',')===k)isAssigned=true;
    if(!isAssigned)cands.push(allF[k]);
  }
  for(i=0;i<idle.length;i++){
    d=idle[i]; var best=null,bb=-1;
    for(var c=0;c<cands.length;c++){
      var t=cands[c];
      var dist=Math.sqrt((t[0]-d.x)*(t[0]-d.x)+(t[1]-d.y)*(t[1]-d.y));
      var b=10/(1+dist);
      if(b>bb){bb=b;best=t;}
    }
    if(best){d.assigned=best;cands.splice(cands.indexOf(best),1);}
  }
  // move
  for(i=0;i<dogs.length;i++){
    d=dogs[i];
    if(!d.assigned)continue;
    var tx=d.assigned[0], ty=d.assigned[1];
    var dx=tx-d.x, dy=ty-d.y, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<0.5){d.assigned=null;continue;}
    var nx=d.x+dx/dist*0.6, ny=d.y+dy/dist*0.6;
    if(ok(nx,ny)){d.x=nx;d.y=ny;}else{d.assigned=null;}
    for(var ti=0;ti<targets.length;ti++){
      if(!found[ti]&&Math.sqrt((d.x-targets[ti][0])*(d.x-targets[ti][0])+(d.y-targets[ti][1])*(d.y-targets[ti][1]))<1.5)
        found[ti]=1;
    }
  }
  var cnt=0;for(k in found)cnt++;
  return cnt===targets.length;
}

function draw(){
  ctx.fillStyle='#161b22';ctx.fillRect(0,0,W,W);
  // explored
  for(var x=0;x<GS;x++)for(var y=0;y<GS;y++){
    var seen=false;
    for(var i=0;i<dogs.length;i++)if(dogs[i].known[x+','+y]){seen=true;break;}
    if(seen){ctx.fillStyle='#263238';ctx.fillRect(x*CELL,y*CELL,CELL-1,CELL-1);}
  }
  // regions
  for(var r=0;r<REGIONS.length;r++){
    var reg=REGIONS[r];
    ctx.beginPath();
    for(var p=0;p<reg.poly.length;p++){
      var px=reg.poly[p][0]*CELL, py=reg.poly[p][1]*CELL;
      if(p===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=reg.color;ctx.globalAlpha=.3;ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=reg.color;ctx.lineWidth=2;ctx.stroke();
    // label
    var cx=0,cy=0;
    for(p=0;p<reg.poly.length;p++){cx+=reg.poly[p][0];cy+=reg.poly[p][1];}
    cx/=reg.poly.length;cy/=reg.poly.length;
    ctx.fillStyle='#e0e0e0';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText(reg.name,cx*CELL,cy*CELL);
  }
  // targets
  for(var i=0;i<targets.length;i++){
    var tx=(targets[i][0]+.5)*CELL, ty=(targets[i][1]+.5)*CELL;
    if(found[i]){
      ctx.fillStyle='#4caf50';ctx.beginPath();ctx.arc(tx,ty,8,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.fillText('✓',tx,ty+3);
    }else{
      ctx.strokeStyle='#ff5252';ctx.setLineDash([3,2]);ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(tx,ty,8,0,7);ctx.stroke();ctx.setLineDash([]);
    }
  }
  // dogs
  for(i=0;i<dogs.length;i++){
    var d=dogs[i];
    var cx=(d.x+.5)*CELL, cy=(d.y+.5)*CELL;
    if(d.assigned){
      ctx.strokeStyle=DC[i%DC.length];ctx.globalAlpha=.35;ctx.lineWidth=1;
      ctx.setLineDash([2,3]);
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo((d.assigned[0]+.5)*CELL,(d.assigned[1]+.5)*CELL);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    ctx.fillStyle=DC[i%DC.length];
    ctx.beginPath();ctx.moveTo(cx,cy-7);ctx.lineTo(cx-6,cy+5);ctx.lineTo(cx+6,cy+5);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=.5;ctx.stroke();
    ctx.fillStyle=DC[i%DC.length];ctx.font='8px Consolas';ctx.fillText(''+d.id,cx,cy+14);
  }
  var fc=0;for(var k in found)fc++;
  stats.textContent='步数='+step+'  找到='+fc+'/'+targets.length+'  狗='+dogs.length;
}

function tick(){
  var done=stepSim();
  draw();
  if(done){stats.textContent+='  ✓ 全部找到!';return;}
  timer=setTimeout(tick,80);
}

try{init();}catch(e){stats.textContent='错误: '+e.message;}
</script>
</body>
</html>
