<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>雷波林场 — 多狗协同搜索</title>
<style>
  body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui;display:flex;flex-direction:column;align-items:center}
  h2{margin:10px 0 2px;font-size:16px}
  .sub{font-size:12px;color:#8b949e;margin:2px 0 8px}
  #stats{font-family:Consolas,monospace;font-size:13px;color:#58a6ff;margin:4px 0}
  canvas{border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
  .legend{display:flex;gap:14px;font-size:11px;color:#8b949e;margin-top:6px;flex-wrap:wrap;justify-content:center}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:middle}
</style>
</head>
<body>
<h2>雷波林场 · 多狗协同搜索</h2>
<div class="sub">真实林下经济地块（石斛 / 黄莲）· 10只机器狗 · 市场竞拍协同</div>
<canvas id="cv"></canvas>
<div id="stats">初始化...</div>
<div class="legend">
  <span><span class="sw" style="background:#2d5a27"></span>石斛</span>
  <span><span class="sw" style="background:#5a4a2d"></span>黄莲</span>
  <span><span class="sw" style="background:#3d3d5c"></span>不可通行</span>
  <span><span class="sw" style="background:#ff5252;border-radius:50%"></span>目标(幸存者)</span>
  <span><span class="sw" style="background:#4caf50;border-radius:50%"></span>已找到</span>
  <span><span class="sw" style="background:#263238"></span>已探索</span>
</div>
<script>
const CELL=24,GS=40,W=GS*CELL;
const cv=document.getElementById('cv');cv.width=W;cv.height=W;
const ctx=cv.getContext('2d');
const stats=document.getElementById('stats');

// 真实地块多边形 (从 KMZ 解析简化)
// 石斛地块 (125点, 简化为近似形状)
const SHIHU=[[[8,32],[10,35],[14,36],[18,34],[20,30],[18,26],[14,24],[10,25],[8,28],[8,32]];
// 黄莲地块 (649点, 简化)
const HUANGLIAN=[[[22,10],[26,8],[30,9],[34,12],[35,16],[33,20],[28,22],[24,20],[22,16],[22,10]];
// 待定区域1
const DAIDING1=[[[10,8],[14,6],[17,8],[16,12],[12,14],[9,12],[10,8]];
// 待定区域2
const DAIDING2=[[[28,28],[32,26],[35,28],[34,32],[30,34],[27,32],[28,28]];

const REGIONS=[
  {name:'石斛',poly:SHIHU[0],color:'#2d5a27',label:'Dendrobium'},
  {name:'黄莲',poly:HUANGLIAN[0],color:'#5a4a2d',label:'Coptis'},
  {name:'待定A',poly:DAIDING1[0],color:'#3a3a3a',label:''},
  {name:'待定B',poly:DAIDING2[0],color:'#3a3a3a',label:''},
];

const DOG_COLORS=['#4fc3f7','#ffb74d','#81c784','#e57373','#ba68c8','#4dd0e1','#f06292','#aed581','#ff8a65','#9575cd','#4db6ac','#fff176','#ff8a80','#7986cb','#a1887f','#90a4ae'];
const NDOGS=10;
let dogs,targets,found,step,timer;

function init(){
  step=0;found=new Set();
  // 目标放在不同地块内
  targets=[[12,30],[27,14],[12,10],[31,30]];
  // 狗从中心出发
  dogs=[];
  for(let i=0;i<NDOGS;i++){
    const a=2*Math.PI*i/NDOGS;
    dogs.push({
      id:i,
      x:20+5*Math.cos(a),y:20+5*Math.sin(a),
      known:new Set(),
      assigned:null
    });
  }
  clearTimeout(timer);
  tick();
}

function inPoly(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    if(((poly[i][1]>y)!==(poly[j][1]>y))&&
       x<(poly[j][0]-poly[i][0])*(y-poly[i][1])/(poly[j][1]-poly[i][1])+poly[i][0])
      inside=!inside;
  }
  return inside;
}

function traversable(x,y){
  if(x<0||x>=GS||y<0||y>=GS)return false;
  // 在任一地块内 = 可通行
  for(const r of REGIONS)if(inPoly(x,y,r.poly))return true;
  return false;
}

function scan(d){
  const x=Math.round(d.x),y=Math.round(d.y);
  for(let dx=-3;dx<=3;dx++)for(let dy=-3;dy<=3;dy++){
    if(dx*dx+dy*dy>9)continue;
    d.known.add((x+dx)+','+(y+dy));
  }
}

function frontiers(d){
  const out=[];
  for(const k of d.known){
    const[x,y]=k.split(',').map(Number);
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(traversable(nx,ny)&&!d.known.has(nx+','+ny))out.push([nx,ny]);
    }
  }
  return out;
}

function stepSim(){
  step++;
  // 竞拍
  const idle=dogs.filter(d=>!d.assigned);
  const allF=new Set();
  dogs.forEach(d=>frontiers(d).forEach(f=>allF.add(f.join(',')));
  targets.forEach((t,i)=>{if(!found.has(i))allF.add(t.join(','))});
  const assigned=new Set(dogs.filter(d=>d.assigned).map(d=>d.assigned.join(',')));
  const cands=[...allF].filter(c=>!assigned.has(c)).map(c=>c.split(',').map(Number));
  for(const d of idle){
    let best=null,bb=-1;
    for(const t of cands){
      const dist=Math.hypot(t[0]-d.x,t[1]-d.y);
      const b=10/(1+dist);
      if(b>bb){bb=b;best=t}
    }
    if(best){d.assigned=best;cands.splice(cands.indexOf(best),1)}
  }
  // 移动
  for(const d of dogs){
    scan(d);
    if(!d.assigned)continue;
    const[tx,ty]=d.assigned;
    const dx=tx-d.x,dy=ty-d.y,dist=Math.hypot(dx,dy);
    if(dist<0.5){d.assigned=null;continue}
    const nx=d.x+dx/dist*0.6,ny=d.y+dy/dist*0.6;
    if(traversable(nx,ny)){d.x=nx;d.y=ny}
    else{d.assigned=null}
    targets.forEach((t,i)=>{
      if(!found.has(i)&&Math.hypot(d.x-t[0],d.y-t[1])<1.5)found.add(i);
    });
  }
  return found.size===targets.length;
}

function draw(){
  ctx.fillStyle='#161b22';ctx.fillRect(0,0,W,W);
  const known=new Set();dogs.forEach(d=>d.known.forEach(k=>known.add(k)));

  // 已探索区域
  for(let x=0;x<GS;x++)for(let y=0;y<GS;y++){
    if(known.has(x+','+y)){
      ctx.fillStyle='#263238';
      ctx.fillRect(x*CELL,y*CELL,CELL-1,CELL-1);
    }
  }

  // 地块
  for(const r of REGIONS){
    ctx.beginPath();
    r.poly.forEach((p,i)=>{
      const px=p[0]*CELL,py=p[1]*CELL;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    });
    ctx.closePath();
    ctx.fillStyle=r.color+'cc';ctx.fill();
    ctx.strokeStyle=r.color;ctx.lineWidth=2;ctx.stroke();

    // 地块名称
    const cx=r.poly.reduce((s,p)=>s+p[0],0)/r.poly.length;
    const cy=r.poly.reduce((s,p)=>s+p[1],0)/r.poly.length;
    ctx.fillStyle='#e0e0e0';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText(r.name,cx*CELL,cy*CELL);
    if(r.label){ctx.font='9px sans-serif';ctx.fillStyle='#a0a0a0';ctx.fillText(r.label,cx*CELL,cy*CELL+13)}
  }

  // 目标
  targets.forEach((t,i)=>{
    const cx=(t[0]+.5)*CELL,cy=(t[1]+.5)*CELL;
    if(found.has(i)){
      ctx.fillStyle='#4caf50';ctx.beginPath();ctx.arc(cx,cy,8,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('✓',cx,cy+3);
    }else{
      ctx.strokeStyle='#ff5252';ctx.setLineDash([3,2]);ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(cx,cy,8,0,7);ctx.stroke();ctx.setLineDash([]);
    }
  });

  // 狗
  dogs.forEach(d=>{
    const cx=(d.x+.5)*CELL,cy=(d.y+.5)*CELL;
    if(d.assigned){
      ctx.strokeStyle=DOG_COLORS[d.id%16];ctx.globalAlpha=.35;ctx.lineWidth=1;
      ctx.setLineDash([2,3]);
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo((d.assigned[0]+.5)*CELL,(d.assigned[1]+.5)*CELL);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    ctx.fillStyle=DOG_COLORS[d.id%16];
    ctx.beginPath();ctx.moveTo(cx,cy-7);ctx.lineTo(cx-6,cy+5);ctx.lineTo(cx+6,cy+5);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=.5;ctx.stroke();
    ctx.fillStyle=DOG_COLORS[d.id%16];ctx.font='8px Consolas';ctx.textAlign='center';
    ctx.fillText(d.id,cx,cy+14);
  });

  const cov=Math.min(known.size/(GS*GS)*100,100);
  stats.textContent=`步数=${step}  找到=${found.size}/${targets.length}  `
    +`覆盖=${cov.toFixed(0)}%  `
    +`任务=${dogs.filter(d=>d.assigned).length}/${NDOGS}`;
}

function tick(){
  const done=stepSim();
  draw();
  if(done){
    stats.textContent+=`  ✓ 全部找到!`;
    return;
  }
  timer=setTimeout(tick,80);
}

init();
</script>
</body>
</html>
